[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apify-propertyguru-sg-client"
version = "0.1.1"
description = "Python client for the rl1987/propertyguru-sg-api-scraper Apify Actor — Singapore property listings from PropertyGuru."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "rl1987", email = "rimantas@keyspace.lt"}]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["apify", "web-scraping", "api-client"]
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://apify.com/rl1987/propertyguru-sg-api-scraper"
Source = "https://apify.com/rl1987/propertyguru-sg-api-scraper"

[tool.setuptools.packages.find]
where = ["src"]
